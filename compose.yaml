# =============================================================================
# ProyectoCafe — API + Portal juntos contra Azure SQL (uso local)
# =============================================================================
# Variables: copia .env.example a .env (gitignored) y complétalo. Compose lee
# .env automáticamente desde la raíz del repositorio; no hay secretos aquí.
#
#   docker compose up --build
#   Portal: http://localhost:3010
#   API:    http://localhost:5000/health
#
# El navegador usa PROYECTOCAFE_API_URL (http://localhost:5000) y el servidor
# del Portal usa PROYECTOCAFE_API_URL_INTERNAL (http://api:8080) dentro de la
# red privada de Compose.
# =============================================================================

name: proyectocafe

services:
  api:
    build:
      context: ./server/api
      dockerfile: Dockerfile
    image: pc-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Cadena y clave llegan desde .env; sin valor el arranque falla de forma clara.
      Database__ConnectionString: ${DATABASE_CONNECTION_STRING:?Define DATABASE_CONNECTION_STRING en .env}
      Auth__Jwt__SigningKey: ${JWT_SIGNING_KEY:?Define JWT_SIGNING_KEY en .env}
      # Solo para validar en local con HTTP. En Azure (HTTPS) debe ser true.
      Auth__Cookie__Secure: "false"
      Auth__Cookie__SameSite: Lax
      Cors__AllowedOrigins__0: ${PORTAL_PUBLIC_ORIGIN:-http://localhost:3010}
      Logging__LogLevel__Default: ${API_LOG_LEVEL:-Information}
    ports:
      - "${API_PORT:-5000}:8080"
    networks:
      - pc-net
    healthcheck:
      # La API solo abre el puerto después del bootstrap de seguridad (que
      # exige conexión a Azure SQL), así que el puerto disponible indica que el
      # arranque terminó. La imagen aspnet no incluye curl/wget.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  portal:
    build:
      context: ./Portal
      dockerfile: Dockerfile
    image: pc-portal:local
    environment:
      # URL publicada al navegador en window.__RUNTIME_ENV__.
      PROYECTOCAFE_API_URL: ${PROYECTOCAFE_API_URL:-http://localhost:5000}
      # URL usada solo por el servidor del Portal (middleware y Server Components).
      PROYECTOCAFE_API_URL_INTERNAL: ${PROYECTOCAFE_API_URL_INTERNAL:-http://api:8080}
      PROYECTOCAFE_AUTH_COOKIE_NAME: ${PROYECTOCAFE_AUTH_COOKIE_NAME:-pc_at}
      APP_NAME: ${APP_NAME:-ProyectoCafe}
    ports:
      - "${PORTAL_PORT:-3010}:3000"
    networks:
      - pc-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  pc-net:
    driver: bridge
